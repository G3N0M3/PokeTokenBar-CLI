[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "poketokenbar"
version = "1.8.0"
description = "AI coding token usage tracker turned into a Pokémon companion for Linux CLI"
readme = "README.md"
authors = [{ name = "PokeTokenBar Contributors" }]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []

[project.scripts]
poketokenbar = "poketokenbar.cli:main"
ptb = "poketokenbar.cli:main"
