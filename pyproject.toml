[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "poketokenbar"
version = "1.11.3"
description = "AI coding token usage tracker turned into a Pokémon companion for Linux CLI"
readme = "README.md"
authors = [{ name = "PokeTokenBar Contributors" }]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
graphics = ["Pillow>=9.0.0"]

[project.scripts]
poketokenbar = "poketokenbar.cli:main"
ptb = "poketokenbar.cli:main"

[tool.setuptools.packages.find]
include = ["poketokenbar*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
poketokenbar = ["assets/sprites/*.png"]

